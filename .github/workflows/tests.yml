name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (TYPO3 ${{ matrix.typo3 }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { typo3: '12.4', php: '8.1' }
          - { typo3: '12.4', php: '8.2' }
          - { typo3: '12.4', php: '8.3' }
          - { typo3: '13.4', php: '8.2' }
          - { typo3: '13.4', php: '8.3' }
          - { typo3: '13.4', php: '8.4' }
    # PHP 8.2+ resolves PHPUnit 11, which reports a deprecation because phpunit.xml
    # uses the 10.5 schema. It is kept so PHP 8.1 (PHPUnit 10) can still read it.
    env:
      # Every public TYPO3 12.4/13.4 release has security advisories against it,
      # which Composer blocks by default. Only affects this test install.
      COMPOSER_NO_BLOCKING: 1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-update \
            "typo3/cms-core:^${{ matrix.typo3 }}" \
            "typo3/cms-backend:^${{ matrix.typo3 }}" \
            "typo3/cms-fluid:^${{ matrix.typo3 }}"
          composer update --no-interaction --no-progress

      - name: Run unit tests
        run: composer test-unit
